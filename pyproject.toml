[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maya-agent"
version = "1.3.1"
description = "AI-powered Maya Agent for game development workflows"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "MayaAgent Team" }]
keywords = ["maya", "ai", "agent", "game-dev", "3d"]
dependencies = [
    "requests>=2.28.0",
    "PyYAML>=6.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
google = ["google-generativeai>=0.3.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
]

[project.scripts]
maya-agent-install = "scripts.install:main"

[tool.setuptools.packages.find]
where = [".", "自定义人物绑定插件"]
include = ["maya_agent*", "max_mcp*"]

[tool.setuptools.package-dir]
"maya_agent.rigs" = "自定义人物绑定插件/maya_agent/rigs"

[tool.setuptools.package-data]
"maya_agent.rigs" = ["custom_body/data/*.json", "custom_body/README.md", "soft_limb/data/*.ma", "soft_limb/data/*.json", "soft_limb/README.md", "soft_leg/data/*.ma", "soft_leg/data/*.json", "soft_leg/README.md", "integrated/README.md", "head_neck/README.md", "controller_shapes/data/*.json", "controller_shapes/README.md"]
maya_agent = ["ui/styles/*.qss", "rigs/custom_body/data/*.json", "rigs/custom_body/README.md", "rigs/soft_limb/data/*.ma", "rigs/soft_limb/data/*.json", "rigs/soft_limb/README.md", "rigs/soft_leg/data/*.ma", "rigs/soft_leg/data/*.json", "rigs/soft_leg/README.md", "rigs/integrated/README.md", "rigs/controller_shapes/data/*.json", "rigs/controller_shapes/README.md", "../resources/**/*", "../config/*.yaml"]
